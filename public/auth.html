<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ورود | هارت‌باکس</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Vazirmatn", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2ffd8);
        background-size: 400% 400%;
        animation: bgMove 12s ease infinite;
        overflow: hidden;
        padding: 20px;
      }
      @keyframes bgMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .bub {
        position: fixed;
        bottom: -90px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        animation: up 13s linear infinite;
      }
      @keyframes up {
        to {
          transform: translateY(-110vh);
          opacity: 0;
        }
      }
      .card {
        position: relative;
        z-index: 2;
        width: min(460px, 94vw);
        max-height: 94vh;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.93);
        backdrop-filter: blur(14px);
        border-radius: 32px;
        padding: 36px 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        animation: pop 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(50px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .logo {
        text-align: center;
        font-size: 1.6rem;
        font-weight: 900;
        margin-bottom: 22px;
      }
      .logo span {
        color: #ff4757;
      }

      /* تب‌ها */
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .tab {
        flex: 1;
        text-align: center;
        padding: 11px;
        border-radius: 14px;
        font-weight: 900;
        cursor: pointer;
        background: #f1f2f6;
        color: #888;
        transition: 0.3s;
        border: none;
        font-family: inherit;
        font-size: 0.95rem;
      }
      .tab.active {
        background: linear-gradient(135deg, #ff4757, #ff6348);
        color: #fff;
        box-shadow: 0 6px 18px rgba(255, 71, 87, 0.35);
      }
      .view {
        display: none;
        flex-direction: column;
      }
      .view.active {
        display: flex;
      }

      input {
        padding: 14px 17px;
        font-family: inherit;
        font-size: 1rem;
        border: 2px solid #eee;
        border-radius: 15px;
        outline: none;
        transition: 0.3s;
        width: 100%;
        margin-bottom: 12px;
      }
      input:focus {
        border-color: #ff4757;
        box-shadow: 0 0 0 5px rgba(255, 71, 87, 0.13);
      }
      select {
        padding: 14px 17px;
        font-family: inherit;
        font-size: 1rem;
        border: 2px solid #eee;
        border-radius: 15px;
        outline: none;
        width: 100%;
        margin-bottom: 12px;
        background: #fff;
      }
      .btn {
        padding: 15px;
        width: 100%;
        border: none;
        border-radius: 15px;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 900;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #1e90ff, #3742fa);
        transition: 0.3s;
        animation: pulseB 2.2s infinite;
        margin-top: 4px;
      }
      .btn:hover {
        transform: scale(1.03);
      }
      @keyframes pulseB {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(30, 144, 255, 0.45);
        }
        50% {
          box-shadow: 0 0 0 14px rgba(30, 144, 255, 0);
        }
      }
      .err {
        display: none;
        background: #ffe3e6;
        color: #c0392b;
        font-weight: 800;
        padding: 12px;
        border-radius: 13px;
        text-align: center;
        margin-bottom: 12px;
        font-size: 0.88rem;
      }
      .divider {
        text-align: center;
        color: #aaa;
        font-weight: 800;
        margin: 22px 0 16px;
        font-size: 0.85rem;
      }
      .reg-cards {
        display: flex;
        gap: 10px;
      }
      .rc {
        flex: 1;
        text-align: center;
        text-decoration: none;
        padding: 16px 6px;
        border-radius: 18px;
        font-weight: 900;
        font-size: 0.88rem;
        transition: 0.3s;
        border: 2px solid #eee;
        background: #fff;
        color: #666;
        cursor: pointer;
        font-family: inherit;
      }
      .rc:hover,
      .rc.sel {
        transform: translateY(-6px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
      }
      .rc small {
        display: block;
        font-weight: 600;
        color: #999;
        margin-top: 4px;
        font-size: 0.72rem;
      }
      .rc-pat.sel {
        border-color: #2ed573;
      }
      .rc-doc.sel {
        border-color: #54a0ff;
      }
      .rc-phar.sel {
        border-color: #a55eea;
      }
    </style>
  </head>
  <body>
    <span class="bub" style="left: 12%; width: 42px; height: 42px"></span>
    <span
      class="bub"
      style="left: 58%; width: 52px; height: 52px; animation-delay: 3s"
    ></span>

    <div class="card">
      <div class="logo">🩺 هارت<span>باکس</span></div>

      <!-- 🗂 تب‌ها -->
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="showView('login')">
          🔓 ورود
        </button>
        <button class="tab" id="tabReg" onclick="showView('reg')">
          📝 ثبت‌نام
        </button>
      </div>

      <!-- 🔓 فرم ورود -->
      <form id="viewLogin" class="view active" onsubmit="doLogin(event)">
        <input id="lPhone" placeholder="📱 شماره موبایل" required />
        <input id="lPass" type="password" placeholder="🔑 رمز عبور" required />
        <div class="err" id="errL"></div>
        <button class="btn">ورود به حساب ❤️</button>
      </form>

      <!-- 📝 فرم ثبت‌نام -->
      <form id="viewReg" class="view" onsubmit="doRegister(event)">
        <input id="rName" placeholder="👤 نام و نام خانوادگی" required />

        <!-- انتخاب نقش -->
        <div class="reg-cards" style="margin-bottom: 12px">
          <button
            type="button"
            class="rc rc-pat sel"
            onclick="pickRole(this, 'patient')"
          >
            👤 بیمار<small>رایگان و سریع</small>
          </button>
          <button
            type="button"
            class="rc rc-doc"
            onclick="pickRole(this, 'doctor')"
          >
            🩺 پزشک<small>با نظام پزشکی</small>
          </button>
          <button
            type="button"
            class="rc rc-phar"
            onclick="pickRole(this, 'pharmacist')"
          >
            💊 داروساز<small>با پروانه</small>
          </button>
        </div>

        <!-- مدرک پزشک/داروساز (فقط وقتی لازم است) -->
        <input
          id="rMedical"
          placeholder="🪪 کد نظام پزشکی / شماره پروانه"
          style="display: none"
        />
        <input
          id="rSpec"
          placeholder="🎯 تخصص (برای پزشک)"
          style="display: none"
        />

        <input id="rPhone" placeholder="📱 شماره موبایل (09...)" required />
        <input
          id="rPass"
          type="password"
          placeholder="🔑 رمز عبور (حداقل ۶ کاراکتر)"
          required
        />
        <div class="err" id="errR"></div>
        <button class="btn">ساخت حساب 🚀</button>
      </form>
    </div>

    <script>
      // ---------- 🗂 سوییچ بین ورود/ثبت‌نام ----------
      function showView(v) {
        document
          .getElementById("viewLogin")
          .classList.toggle("active", v === "login");
        document
          .getElementById("viewReg")
          .classList.toggle("active", v === "reg");
        document
          .getElementById("tabLogin")
          .classList.toggle("active", v === "login");
        document
          .getElementById("tabReg")
          .classList.toggle("active", v === "reg");
      }

      // ---------- 🎭 انتخاب نقش ----------
      let selectedRole = "patient";
      function pickRole(btn, role) {
        selectedRole = role;
        document
          .querySelectorAll(".rc")
          .forEach((b) => b.classList.remove("sel"));
        btn.classList.add("sel");
        const isMed = role !== "patient";
        document.getElementById("rMedical").style.display = isMed
          ? "block"
          : "none";
        document.getElementById("rMedical").required = isMed;
        document.getElementById("rSpec").style.display =
          role === "doctor" ? "block" : "none";
      }

      // ---------- ذخیره توکن ----------
      function saveAuth(j) {
        localStorage.setItem("token", j.token);
        localStorage.setItem("role", j.role);
        localStorage.setItem("name", j.name);
      }

      function goTo(role) {
        location.href = "dashboard.html";
      }

      // ---------- 🔓 ورود ----------
      async function doLogin(e) {
        e.preventDefault();
        document.getElementById("errL").style.display = "none";
        try {
          const r = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              phone: document.getElementById("lPhone").value.trim(),
              password: document.getElementById("lPass").value,
            }),
          });
          const j = await r.json();
          if (!j.ok) {
            document.getElementById("errL").textContent =
              "⚠️ " + (j.error || "خطا در ورود");
            document.getElementById("errL").style.display = "block";
            return;
          }
          saveAuth(j);
          goTo(j.role);
        } catch (err) {
          document.getElementById("errL").textContent =
            "⚠️ خطا در ارتباط با سرور!";
          document.getElementById("errL").style.display = "block";
        }
      }

      // ---------- 📝 ثبت‌نام ----------
      async function doRegister(e) {
        e.preventDefault();
        document.getElementById("errR").style.display = "none";
        try {
          const r = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              phone: document.getElementById("rPhone").value.trim(),
              password: document.getElementById("rPass").value,
              full_name: document.getElementById("rName").value.trim(),
              role: selectedRole,
              medical_id: document.getElementById("rMedical").value.trim(),
              specialty: document.getElementById("rSpec").value.trim(),
            }),
          });
          const j = await r.json();
          if (!j.ok) {
            document.getElementById("errR").textContent =
              "⚠️ " + (j.error || "خطا در ثبت‌نام");
            document.getElementById("errR").style.display = "block";
            return;
          }
          saveAuth(j);
          goTo(j.role);
        } catch (err) {
          document.getElementById("errR").textContent =
            "⚠️ خطا در ارتباط با سرور!";
          document.getElementById("errR").style.display = "block";
        }
      }
    </script>
  </body>
</html>
