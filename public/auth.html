<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ورود | هارت‌باکس</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Vazirmatn", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #a1c4fd, #c2ffd8);
        background-size: 400% 400%;
        animation: bgMove 12s ease infinite;
        overflow: hidden;
        padding: 20px;
      }
      @keyframes bgMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .bub {
        position: fixed;
        bottom: -90px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        animation: up 13s linear infinite;
      }
      @keyframes up {
        to {
          transform: translateY(-110vh);
          opacity: 0;
        }
      }
      .card {
        position: relative;
        z-index: 2;
        width: min(430px, 94vw);
        background: rgba(255, 255, 255, 0.93);
        backdrop-filter: blur(14px);
        border-radius: 32px;
        padding: 36px 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        animation: pop 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(50px) scale(0.9);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .logo {
        text-align: center;
        font-size: 1.6rem;
        font-weight: 900;
        margin-bottom: 22px;
      }
      .logo span {
        color: #ff4757;
      }
      input {
        padding: 14px 17px;
        font-family: inherit;
        font-size: 1rem;
        border: 2px solid #eee;
        border-radius: 15px;
        outline: none;
        transition: 0.3s;
        width: 100%;
        margin-bottom: 12px;
      }
      input:focus {
        border-color: #ff4757;
        box-shadow: 0 0 0 5px rgba(255, 71, 87, 0.13);
      }
      .btn {
        padding: 15px;
        width: 100%;
        border: none;
        border-radius: 15px;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 900;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #1e90ff, #3742fa);
        transition: 0.3s;
        animation: pulseB 2.2s infinite;
      }
      .btn:hover {
        transform: scale(1.03);
      }
      @keyframes pulseB {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(30, 144, 255, 0.45);
        }
        50% {
          box-shadow: 0 0 0 14px rgba(30, 144, 255, 0);
        }
      }
      .err {
        display: none;
        background: #ffe3e6;
        color: #c0392b;
        font-weight: 800;
        padding: 12px;
        border-radius: 13px;
        text-align: center;
        margin-bottom: 12px;
      }
      .divider {
        text-align: center;
        color: #aaa;
        font-weight: 800;
        margin: 24px 0 14px;
        font-size: 0.85rem;
      }
      .reg-cards {
        display: flex;
        gap: 10px;
      }
      .rc {
        flex: 1;
        text-align: center;
        text-decoration: none;
        padding: 16px 6px;
        border-radius: 18px;
        font-weight: 900;
        font-size: 0.88rem;
        transition: 0.3s;
        border: 2px solid #eee;
        background: #fff;
        color: #666;
      }
      .rc:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
      }
      .rc small {
        display: block;
        font-weight: 600;
        color: #999;
        margin-top: 4px;
        font-size: 0.72rem;
      }
      .rc-pat:hover {
        border-color: #2ed573;
      }
      .rc-doc:hover {
        border-color: #54a0ff;
      }
      .rc-phar:hover {
        border-color: #a55eea;
      }
    </style>
  </head>
  <body>
    <span class="bub" style="left: 12%; width: 42px; height: 42px"></span>
    <span
      class="bub"
      style="left: 58%; width: 52px; height: 52px; animation-delay: 3s"
    ></span>

    <div class="card">
      <div class="logo">🩺 هارت<span>باکس</span></div>

      <!-- 🔓 فقط ورود -->
      <form
        onsubmit="doLogin(event)"
        style="display: flex; flex-direction: column"
      >
        <input id="lPhone" placeholder="📱 شماره موبایل" required />
        <input id="lPass" type="password" placeholder="🔑 رمز عبور" required />
        <div class="err" id="errL"></div>
        <button class="btn">ورود به حساب ❤️</button>
      </form>

      <div class="divider">— یا ثبت‌نام به‌عنوان —</div>

      <!-- 🎭 سه صفحه ثبت‌نام جدا -->
      <div class="reg-cards">
        <a class="rc rc-pat" href="register-patient.html"
          >👤 بیمار<small>رایگان و سریع</small></a
        >
        <a class="rc rc-doc" href="register-doctor.html"
          >🩺 پزشک<small>با نظام پزشکی</small></a
        >
        <a class="rc rc-phar" href="register-pharmacist.html"
          >💊 داروساز<small>با پروانه</small></a
        >
      </div>
    </div>

    <script>
      async function doLogin(e) {
        e.preventDefault();
        errL.style.display = "none";
        try {
          const r = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              phone: lPhone.value.trim(),
              password: lPass.value,
            }),
          });
          const j = await r.json();
          if (!j.ok) {
            errL.textContent = "⚠️ " + (j.error || "خطا در ورود");
            errL.style.display = "block";
            return;
          }

          // ✅ ذخیره توکن و اطلاعات کاربر  ←←← اینجا
          localStorage.setItem("token", j.token);
          localStorage.setItem("role", j.role);
          localStorage.setItem("name", j.name);

          // 🧭 هدایت بر اساس نقش
          const target =
            { doctor: "doctor-panel.html", admin: "admin.html" }[j.role] ||
            "dashboard.html";
          location.href = target;
        } catch (err) {
          errL.textContent = "⚠️ خطا در ارتباط با سرور!";
          errL.style.display = "block";
        }
      }
    </script>
  </body>
</html>
