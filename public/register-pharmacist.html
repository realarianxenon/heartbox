<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ثبت‌نام داروساز | هارت‌باکس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(-45deg,#f3e5f5,#e8d5f5,#dfe9f3,#c2ffd8);background-size:400% 400%;
  animation:bg 12s ease infinite;padding:20px}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.card{width:min(440px,94vw);background:rgba(255,255,255,.93);backdrop-filter:blur(14px);
  border-radius:32px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.15);
  animation:pop .7s cubic-bezier(.68,-.55,.27,1.55) both}
@keyframes pop{from{opacity:0;transform:translateY(50px) scale(.9)}to{opacity:1;transform:none}}
.logo{text-align:center;font-size:1.5rem;font-weight:900;margin-bottom:6px}
.logo span{color:#ff4757}
.sub{text-align:center;color:#7b1fa2;font-weight:900;margin-bottom:20px}
.notice{background:#fff8e1;color:#856404;border-radius:14px;padding:12px 16px;font-size:.85rem;
  font-weight:700;line-height:1.9;margin-bottom:18px}
input{padding:14px 17px;font-family:inherit;font-size:1rem;border:2px solid #eee;border-radius:15px;
  outline:none;transition:.3s;width:100%;margin-bottom:12px}
input:focus{border-color:#7b1fa2;box-shadow:0 0 0 5px rgba(123,31,162,.12)}
.lic:focus{border-color:#ffa502 !important;box-shadow:0 0 0 5px rgba(255,165,2,.15) !important}
.btn{padding:15px;width:100%;border:none;border-radius:15px;font-family:inherit;font-size:1.05rem;
  font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(135deg,#a55eea,#7b1fa2);transition:.3s}
.btn:hover{transform:scale(1.03)}
.err{display:none;background:#ffe3e6;color:#c0392b;font-weight:800;padding:12px;border-radius:13px;
  text-align:center;margin-bottom:12px}
.back{text-align:center;margin-top:18px}
.back a{color:#888;text-decoration:none;font-weight:700}
.back a:hover{color:#ff4757}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🩺 هارت<span>باکس</span></div>
  <div class="sub">💊 ثبت‌نام داروساز</div>

  <div class="notice">
    ℹ️ پس از ثبت‌نام، درخواست شما توسط <b>ادمین</b> بررسی می‌شود؛ تا پیش از تأیید،
    مثل بیمار عادی از سایت استفاده می‌کنید و پنل داروسازی فعال نخواهد بود.
  </div>

  <form onsubmit="doRegister(event)">
    <input id="rName"  placeholder="👤 نام و نام خانوادگی" required>
    <input id="rLic"   class="lic" placeholder="🔢 شماره پروانه داروسازی" required>
    <input id="rSpec"  placeholder="🏷️ حوزه تخصصی (مثلاً: داروسازی بالینی)">
    <input id="rPhone" placeholder="📱 شماره موبایل (09...)" required>
    <input id="rPass"  type="password" placeholder="🔑 رمز عبور (حداقل ۸ کاراکتر)" required>
    <input id="rPass2" type="password" placeholder="🔁 تکرار رمز عبور" required>
    <div class="err" id="errR"></div>
    <button class="btn">ارسال درخواست داروساز 📨</button>
  </form>

  <div class="back"><a href="auth.html">← بازگشت</a></div>
</div>

<script>
async function doRegister(e){
  e.preventDefault();
  errR.style.display='none';

  if(rLic.value.trim().length < 4){ 
    errR.textContent='⚠️ شماره پروانه داروسازی معتبر وارد کنید!'; 
    errR.style.display='block'; 
    return; 
  }
  if(rPass.value.length < 8){ 
    errR.textContent='⚠️ رمز باید حداقل ۸ کاراکتر باشد!'; 
    errR.style.display='block'; 
    return; 
  }
  if(rPass.value !== rPass2.value){ 
    errR.textContent='⚠️ دو رمز یکسان نیستند!'; 
    errR.style.display='block'; 
    return; 
  }

  try {
    const r = await fetch('/api/auth/register',{
      method:'POST', 
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        full_name: rName.value.trim(), 
        phone: rPhone.value.trim(),
        password: rPass.value,
        role_request: 'pharmacist',
        license_no: rLic.value.trim(),
        specialty: rSpec.value.trim()
      })
    });
    
    const j = await r.json();
    if(!j.ok){ 
      errR.textContent='⚠️ '+j.error; 
      errR.style.display='block'; 
      return; 
    }
    
    alert('📨 '+j.message);
    location.href='dashboard.html';
  } catch(err) {
    errR.textContent='⚠️ خطا در ارتباط با سرور!'; 
    errR.style.display='block';
    console.error(err);
  }
}
</script>
</body>
</html>
